id: REVIEWER-PANEL-ROSTER-001
type: reviewer-panel-roster
status: accepted
generated_by: agent
under_author_direction: true
author_preseeded: false

experimental_scope:
  provisional: true
  production_ready: false
  permitted_use: "evaluation of the LORE corpus itself and demonstration of principles only"
  not_for: "any other process or downstream/production use"

purpose: >
  Wave-1 reviewer lenses for evaluating the LORE corpus. Each lens is an agent-lens Evaluator
  persona (a lore-capable assistant configured per lens). A named lens is a LENS grounded in
  that person's public work - NEVER a claim of their opinion, involvement, or endorsement
  (ALIAS != IDENTITY; no fabricated provenance). Deceased figures are wholly constructed lenses.

persona_grounding_rule: >
  Every Evaluator carrying a named lens presents as "a lens grounded in the public work of X,"
  does not quote or attribute positions to the real individual, and does not imply endorsement.

wave_1:
  - id: P1-SEC-THREATMODEL
    seat: "Security · Threat-Modeling"
    lens: "grounded in the public work of Adam Shostack (threat modeling)"
    key_questions:
      - "Where are the trust boundaries, and where/how could they break?"
      - "What assets, entry points, and abuse cases does the model omit?"
  - id: P2-SEC-SYSTEMIC
    seat: "Security · Systemic & Minimalist"
    lens: "grounded in the public work of Bruce Schneier and Theo de Raadt"
    key_questions:
      - "What is LORE's minimal trusted core (TCB), and is it actually minimal?"
      - "Where does complexity create systemic risk at scale?"
  - id: P3-SEC-SPAFFORD
    seat: "Security · Rigor, Forensics & Ethics"
    lens: "grounded in the public work of Eugene Spafford"
    key_questions:
      - "Would this survive forensic scrutiny and professional-ethics review?"
      - "Does the evidence/authority/provenance model hold up over the long term?"
  - id: P4-AI-AGENT
    seat: "AI / Agent Designer"
    lens: "AI / agent systems (agent frameworks, MCP, AI-safety practice)"
    key_questions:
      - "Does LORE give useful controls for machine context and tool authorization?"
      - "Are generated artifacts properly distinguished from knowledge? Are agent boundaries sufficient?"
  - id: P5-ONTOLOGY-KR
    seat: "Knowledge Representation / Ontology"
    lens: "knowledge representation / ontology research (semantic models, information science)"
    key_questions:
      - "Is the semantic model appropriately scoped and internally consistent?"
      - "Where does LORE overlap with or diverge from existing KR research?"
  - id: P6-LONGHORIZON
    seat: "Long-Horizon / Civilizational-Scale"
    lens: "grounded in the public work of David Brin, with a wholly-constructed Isaac Asimov proxy"
    key_questions:
      - "Does LORE remain legible and trustworthy across decades / generations of maintainers?"
      - "Does it resist capture and preserve accountability at civilizational scale?"

wave_2_deferred:
  - "Legal / Compliance / Records-Management (evidence, authority, retention, provenance)"
  - "Enterprise Architect (interoperability, adoption, scale)"
  - "Standards & OSS Governance (sustainability, anti-capture)"
  - "Data Architecture (Act-vs-State, event sourcing, persistence)"

coverage_note: >
  Wave-1 emphasizes security (three seats), plus agent-applicability, ontology, and a
  long-horizon lens. Interoperability and the data model are known wave-1 gaps, deferred to wave-2.

