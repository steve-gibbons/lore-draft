name: LORE validate

# Enforcement-at-rest for the governance checks (addresses KF-02): runs the 10-check
# validator on every push and pull request, so governance isn't only an opt-in local step.
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false            # validator needs no LFS objects
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run LORE governance validator (10 checks)
        if: always()
        run: python3 TOOLS/lore_validate.py
      - name: Run tree-local TESTS/*.py (skip files not in this tree)
        if: always()
        shell: bash
        run: |
          fail=0
          run_if() {
            if [ -f "$1" ]; then
              echo "== $1 =="
              python3 "$1" || fail=1
            else
              echo "skip: $1 not in this tree"
            fi
          }
          if [ -f TESTS/test_validator.py ]; then
            python3 -m pytest TESTS/test_validator.py -v 2>/dev/null || python3 TESTS/test_validator.py || fail=1
          else
            echo "skip: TESTS/test_validator.py not in this tree"
          fi
          run_if TESTS/test_serve.py
          run_if TESTS/test_seal.py
          run_if TESTS/test_export.py
          run_if TESTS/test_publish.py
          run_if TESTS/test_yaml_parser.py
          run_if TESTS/test_signature_convention.py
          run_if TESTS/test_dispatcher.py
          exit $fail
      - name: Manifest is generated and not stale (T3.5)
        if: always()
        run: python3 TOOLS/lore_build_manifest.py --check
      - name: Import author public key (if published)
        if: always()
        shell: bash
        run: 'if compgen -G "KEYS/*.asc" > /dev/null; then gpg --batch --import KEYS/*.asc; else echo "no KEYS/*.asc to import"; fi'
      - name: Every detached signature covers its artifact (LL-004)
        if: always()
        shell: bash
        run: |
          if [ -f TOOLS/lore_verify_signatures.py ]; then python3 TOOLS/lore_verify_signatures.py
          else echo "skip: TOOLS/lore_verify_signatures.py not in this tree"; fi
      - name: Verify author-only artifact signatures (strict, KF-01)
        if: always()
        run: python3 TOOLS/lore_verify_author_sig.py --strict
      - name: Guard — detached signatures must not be gitignorable
        if: always()
        shell: bash
        run: |
          bad=0
          for p in KEYS/__sigguard__.asc INTAKE/__sigguard__.asc __sigguard__.asc; do
            if git check-ignore -q "$p"; then echo "ERROR: .gitignore would ignore $p (stray *.asc-style rule)"; bad=1; fi
          done
          exit $bad
      - name: Shell footgun signatures (lore_lint SIG-SH-*)
        if: always()
        shell: bash
        run: |
          if [ -f TOOLS/lore_lint.py ]; then python3 TOOLS/lore_lint.py
          else echo "skip: TOOLS/lore_lint.py not in this tree"; fi
      - name: Workbench regression (demo.sh as smoke test)
        if: always()
        shell: bash
        run: |
          if [ -f WORKBENCH/demo.sh ]; then
            DEMO_AUTOPLAY=1 DEMO_DELAY=0 DEMO_CHECK=1 DEMO_TRANSPORT=1 DEMO_EXCHANGE=1 DEMO_INGEST=1 DEMO_EGRESS=1 DEMO_WATCH=1 ./WORKBENCH/demo.sh
          else
            echo "skip: WORKBENCH/demo.sh not in this tree"
          fi
