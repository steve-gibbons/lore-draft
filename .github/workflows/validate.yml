name: LORE validate

# Enforcement-at-rest for the governance checks (addresses KF-02): runs the 10-check
# validator on every push and pull request, so governance isn't only an opt-in local step.
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false            # validator needs no LFS objects
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run LORE governance validator (10 checks)
        run: python3 TOOLS/lore_validate.py
      - name: Run pytest test suite (or plain-script fallback)
        run: python3 -m pytest TESTS/test_validator.py -v 2>/dev/null || python3 TESTS/test_validator.py
      - name: Run lore_serve integration tests
        run: python3 TESTS/test_serve.py
      - name: Manifest is generated and not stale (T3.5)
        run: python3 TOOLS/lore_build_manifest.py --check
      - name: Import author public key (if published)
        shell: bash
        run: 'if compgen -G "KEYS/*.asc" > /dev/null; then gpg --batch --import KEYS/*.asc; else echo "no KEYS/*.asc to import"; fi'
      - name: Verify author-only artifact signatures (strict, KF-01)
        run: python3 TOOLS/lore_verify_author_sig.py --strict
      - name: Guard — detached signatures must not be gitignorable
        shell: bash
        run: |
          bad=0
          for p in KEYS/__sigguard__.asc INTAKE/__sigguard__.asc __sigguard__.asc; do
            if git check-ignore -q "$p"; then echo "ERROR: .gitignore would ignore $p (stray *.asc-style rule)"; bad=1; fi
          done
          exit $bad
      - name: Shell footgun signatures (lore_lint SIG-SH-*)
        run: python3 TOOLS/lore_lint.py
      - name: Workbench regression (demo.sh as smoke test)
        shell: bash
        run: DEMO_AUTOPLAY=1 DEMO_DELAY=0 DEMO_CHECK=1 DEMO_TRANSPORT=1 DEMO_EXCHANGE=1 DEMO_INGEST=1 DEMO_EGRESS=1 DEMO_WATCH=1 ./WORKBENCH/demo.sh
